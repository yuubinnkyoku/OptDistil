name: generate-uv-lock

on:
  push:
    paths:
      - "pyproject.toml"
      - ".python-version"
      - ".github/workflows/generate-uv-lock.yml"
  workflow_dispatch:

concurrency:
  group: generate-uv-lock-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v9
        with:
          version: "0.12.10"
          enable-cache: true
      - name: Generate lockfile
        run: uv lock
      - name: Upload lockfile
        uses: actions/upload-artifact@v7
        with:
          name: uv-lock
          path: uv.lock
          if-no-files-found: error
