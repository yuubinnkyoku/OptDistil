name: contextual-coupled-robustness

on:
  push:
    branches:
      - experiment/contextual-teacher
    paths:
      - "src/optdistil/teachers/meta_attention.py"
      - "src/optdistil/teachers/meta_mlp.py"
      - "scripts/probe_contextual_coupled.py"
      - ".github/workflows/contextual-coupled-robustness.yml"
  workflow_dispatch:

concurrency:
  group: contextual-coupled-robustness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  robustness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.10"
          python-version: "3.11"
          enable-cache: true
      - name: Sync CPU environment
        run: uv sync --locked --extra cpu
      - name: Ruff
        run: uv run --locked --extra cpu ruff check scripts/probe_contextual_coupled.py src/optdistil/teachers/meta_attention.py
      - name: Extended matched-capacity comparison
        run: >-
          uv run --locked --extra cpu python scripts/probe_contextual_coupled.py
          --meta-iterations 60
          --train-tasks 4
          --validation-tasks 4
          --test-tasks 8
          --teacher-seeds 3
          --output artifacts/contextual-coupled-robustness.json
      - name: Upload robustness metrics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: contextual-coupled-robustness
          path: artifacts/contextual-coupled-robustness.json
          if-no-files-found: ignore
