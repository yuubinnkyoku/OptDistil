name: secant-bounded-gain-robustness

on:
  push:
    branches:
      - experiment/contextual-teacher
    paths:
      - "src/optdistil/distill/secant_meta.py"
      - "src/optdistil/distill/secant_features.py"
      - "scripts/probe_secant_bounded_gain_control.py"
      - "scripts/probe_secant_bounded_gain_robustness.py"
      - "scripts/probe_secant_history_pareto.py"
      - "scripts/probe_oracle_feature_bottleneck.py"
      - ".github/workflows/secant-bounded-gain-robustness.yml"
  workflow_dispatch:

concurrency:
  group: secant-bounded-gain-robustness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  robust:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.10"
          python-version: "3.11"
          enable-cache: true
      - name: Sync CPU environment
        run: uv sync --locked --extra cpu
      - name: Ruff
        run: uv run --locked --extra cpu ruff check scripts/probe_secant_bounded_gain_robustness.py
      - name: Secant meta tests
        run: uv run --locked --extra cpu pytest -q tests/test_secant_meta.py tests/test_secant_features.py
      - name: Robustness and condition OOD comparison
        run: >-
          uv run --locked --extra cpu python scripts/probe_secant_bounded_gain_robustness.py
          --output artifacts/secant-bounded-gain-robustness.json
      - name: Upload metrics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: secant-bounded-gain-robustness
          path: artifacts/secant-bounded-gain-robustness.json
          if-no-files-found: ignore
