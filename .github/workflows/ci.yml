name: ci

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.10"
          python-version: "3.11"
          enable-cache: true
      - name: Sync CPU environment
        run: uv sync --locked --extra cpu
      - name: Ruff
        run: uv run --locked --extra cpu ruff check .
      - name: Tests
        run: uv run --locked --extra cpu pytest -q
      - name: End-to-end smoke distillation
        run: uv run --locked --extra cpu python scripts/smoke_distill.py
      - name: Teacher comparison smoke experiment
        run: uv run --locked --extra cpu python scripts/compare_teachers.py --quick
      - name: Teacher condition probe
        run: uv run --locked --extra cpu python scripts/probe_teacher_conditions.py
      - name: Student teacher mechanism probe
        run: uv run --locked --extra cpu python scripts/probe_student_teacher_mechanisms.py
      - name: Same-state student Muon alignment probe
        run: uv run --locked --extra cpu python scripts/probe_same_state_alignment.py
      - name: Muon-gradient disagreement-selected probe
        run: >-
          uv run --locked --extra cpu python scripts/run_disagreement_probe.py
          --output artifacts/muon-gradient-disagreement.json
      - name: Block-gain granularity sweep
        run: >-
          uv run --locked --extra cpu python scripts/probe_block_gain_sweep.py
          --output artifacts/block-gain-sweep.json
      - name: Upload disagreement probe metrics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: muon-gradient-disagreement
          path: artifacts/muon-gradient-disagreement.json
          if-no-files-found: ignore
      - name: Upload block-gain sweep metrics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: block-gain-sweep
          path: artifacts/block-gain-sweep.json
          if-no-files-found: ignore
