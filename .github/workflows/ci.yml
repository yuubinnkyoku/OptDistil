name: ci

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install CPU PyTorch
        run: python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.4"
      - name: Install OptDistil
        run: |
          python -m pip install -e . --no-deps
          python -m pip install "pytest>=8" "ruff>=0.6"
      - name: Ruff
        run: ruff check .
      - name: Tests
        run: pytest -q
      - name: End-to-end smoke distillation
        run: python scripts/smoke_distill.py
