name: multitensor-static-role-control

on:
  push:
    branches:
      - experiment/stochastic-distillation
    paths:
      - "src/optdistil/multitensor/mechanisms.py"
      - "scripts/probe_multitensor_static_role_control.py"
      - "tests/test_multitensor_mechanisms.py"
      - ".github/workflows/multitensor-static-role-control.yml"
  workflow_dispatch:

concurrency:
  group: multitensor-static-role-control-${{ github.ref }}
  cancel-in-progress: true

jobs:
  control:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.10"
          python-version: "3.11"
          enable-cache: true
      - name: Sync CPU environment
        run: uv sync --locked --extra cpu
      - name: Ruff
        run: >-
          uv run --locked --extra cpu ruff check --ignore B023
          src/optdistil/multitensor/mechanisms.py
          scripts/probe_multitensor_static_role_control.py
          tests/test_multitensor_mechanisms.py
      - name: Mechanism tests
        run: >-
          uv run --locked --extra cpu pytest -q
          tests/test_multitensor_mechanisms.py
          tests/test_multitensor.py
      - name: Static role control
        run: >-
          uv run --locked --extra cpu python scripts/probe_multitensor_static_role_control.py
          --output artifacts/multitensor-static-role-control.json
      - name: Upload metrics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: multitensor-static-role-control
          path: artifacts/multitensor-static-role-control.json
          if-no-files-found: ignore
