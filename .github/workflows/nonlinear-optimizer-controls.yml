name: nonlinear-optimizer-controls

on:
  push:
    branches:
      - experiment/contextual-teacher
    paths:
      - "src/optdistil/tasks/frozen_readout_mlp.py"
      - "src/optdistil/distill/secant_features.py"
      - "src/optdistil/teachers/adamw.py"
      - "src/optdistil/teachers/muon.py"
      - "src/optdistil/teachers/gradient_direction.py"
      - "scripts/probe_nonlinear_optimizer_controls.py"
      - "tests/test_frozen_readout_mlp.py"
      - "tests/test_secant_features.py"
      - ".github/workflows/nonlinear-optimizer-controls.yml"
  workflow_dispatch:

concurrency:
  group: nonlinear-optimizer-controls-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.10"
          python-version: "3.11"
          enable-cache: true
      - name: Sync CPU environment
        run: uv sync --locked --extra cpu
      - name: Ruff
        run: uv run --locked --extra cpu ruff check scripts/probe_nonlinear_optimizer_controls.py
      - name: Nonlinear task and secant tests
        run: >-
          uv run --locked --extra cpu pytest -q
          tests/test_frozen_readout_mlp.py
          tests/test_secant_features.py
      - name: Nonlinear optimizer controls
        run: >-
          uv run --locked --extra cpu python scripts/probe_nonlinear_optimizer_controls.py
          --output artifacts/nonlinear-optimizer-controls.json
      - name: Upload metrics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nonlinear-optimizer-controls
          path: artifacts/nonlinear-optimizer-controls.json
          if-no-files-found: ignore
