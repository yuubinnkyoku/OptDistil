name: direct-meta-student

on:
  push:
    branches:
      - experiment/meta-teacher-scaling
    paths:
      - "src/optdistil/distill/direct_meta.py"
      - "scripts/probe_direct_meta_student.py"
      - "tests/test_direct_meta.py"
      - ".github/workflows/direct-meta-student.yml"
  workflow_dispatch:

concurrency:
  group: direct-meta-student-${{ github.ref }}
  cancel-in-progress: true

jobs:
  direct-meta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.10"
          python-version: "3.11"
          enable-cache: true
      - name: Sync CPU environment
        run: uv sync --locked --extra cpu
      - name: Direct-meta tests
        run: uv run --locked --extra cpu pytest -q tests/test_direct_meta.py
      - name: Direct-meta tiny student quick probe
        run: >-
          uv run --locked --extra cpu python scripts/probe_direct_meta_student.py
          --quick --output artifacts/direct-meta-student.json
      - name: Upload direct-meta metrics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: direct-meta-student
          path: artifacts/direct-meta-student.json
          if-no-files-found: ignore
