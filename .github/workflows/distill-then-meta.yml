name: distill-then-meta

on:
  push:
    branches:
      - experiment/meta-teacher-scaling
    paths:
      - "scripts/probe_distill_then_meta.py"
      - "src/optdistil/distill/direct_meta.py"
      - "src/optdistil/teachers/meta_mlp.py"
      - ".github/workflows/distill-then-meta.yml"
  workflow_dispatch:

concurrency:
  group: distill-then-meta-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.10"
          python-version: "3.11"
          enable-cache: true
      - name: Sync CPU environment
        run: uv sync --locked --extra cpu
      - name: Ruff
        run: uv run --locked --extra cpu ruff check scripts/probe_distill_then_meta.py src/optdistil/distill/direct_meta.py
      - name: Direct-meta tests
        run: uv run --locked --extra cpu pytest -q tests/test_direct_meta.py tests/test_meta_teacher.py
      - name: Distill then meta quick comparison
        run: >-
          uv run --locked --extra cpu python scripts/probe_distill_then_meta.py
          --quick --output artifacts/distill-then-meta.json
      - name: Upload comparison metrics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: distill-then-meta
          path: artifacts/distill-then-meta.json
          if-no-files-found: ignore
