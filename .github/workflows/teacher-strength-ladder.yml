name: teacher-strength-ladder

on:
  push:
    branches:
      - experiment/contextual-teacher
    paths:
      - "src/optdistil/teachers/newton_oracle.py"
      - "scripts/probe_teacher_strength_ladder.py"
      - "tests/test_newton_oracle.py"
      - ".github/workflows/teacher-strength-ladder.yml"
  workflow_dispatch:

concurrency:
  group: teacher-strength-ladder-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ladder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.10"
          python-version: "3.11"
          enable-cache: true
      - name: Sync CPU environment
        run: uv sync --locked --extra cpu
      - name: Ruff
        run: >-
          uv run --locked --extra cpu ruff check
          src/optdistil/teachers/newton_oracle.py
          scripts/probe_teacher_strength_ladder.py
          tests/test_newton_oracle.py
      - name: Newton oracle tests
        run: uv run --locked --extra cpu pytest -q tests/test_newton_oracle.py
      - name: Teacher strength ladder quick probe
        run: >-
          uv run --locked --extra cpu python scripts/probe_teacher_strength_ladder.py
          --quick --output artifacts/teacher-strength-ladder.json
      - name: Upload ladder metrics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: teacher-strength-ladder
          path: artifacts/teacher-strength-ladder.json
          if-no-files-found: ignore
