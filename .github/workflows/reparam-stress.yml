name: reparameterization-stress

on:
  workflow_dispatch:
  push:
    branches:
      - experiment/stochastic-distillation
    paths:
      - "src/optdistil/multitensor/**"
      - "scripts/probe_reparam_stress.py"
      - "scripts/report_reparam_results.py"
      - "tests/test_reparam_stress.py"
      - ".github/workflows/reparam-stress.yml"

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Sync CPU environment
        run: uv sync --locked --extra cpu
      - name: Ruff
        run: uv run --locked --extra cpu ruff check src/optdistil/multitensor scripts/probe_reparam_stress.py scripts/report_reparam_results.py tests/test_reparam_stress.py
      - name: Focused tests
        run: uv run --locked --extra cpu pytest -q tests/test_reparam_stress.py
      - name: Quick probe
        run: >
          uv run --locked --extra cpu python scripts/probe_reparam_stress.py
          --quick --skip-structured --skip-experiment-b
          --output artifacts/reparam-quick.json
      - name: Report
        run: >
          uv run --locked --extra cpu python scripts/report_reparam_results.py
          --input artifacts/reparam-quick.json
