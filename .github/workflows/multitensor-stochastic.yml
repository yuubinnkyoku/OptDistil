name: multitensor-stochastic

on:
  push:
    branches:
      - experiment/stochastic-distillation
    paths:
      - "src/optdistil/multitensor/**"
      - "scripts/probe_multitensor_main.py"
      - "scripts/report_multitensor_results.py"
      - "tests/test_multitensor.py"
      - ".github/workflows/multitensor-stochastic.yml"
  workflow_dispatch:

concurrency:
  group: multitensor-stochastic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.10"
          python-version: "3.11"
          enable-cache: true
      - name: Sync CPU environment
        run: uv sync --locked --extra cpu
      - name: Ruff
        run: >-
          uv run --locked --extra cpu ruff check
          src/optdistil/multitensor
          scripts/probe_multitensor_main.py
          scripts/report_multitensor_results.py
          tests/test_multitensor.py
      - name: Unit tests
        run: uv run --locked --extra cpu pytest -q tests/test_multitensor.py
      - name: Quick multitensor probe
        run: >-
          uv run --locked --extra cpu python scripts/probe_multitensor_main.py
          --quick
          --skip-meta
          --skip-controls
          --skip-ablations
          --output artifacts/multitensor-quick.json
      - name: Upload metrics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: multitensor-quick
          path: artifacts/multitensor-quick.json
          if-no-files-found: ignore
