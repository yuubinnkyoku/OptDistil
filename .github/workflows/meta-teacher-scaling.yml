name: meta-teacher-scaling

on:
  push:
    branches:
      - experiment/meta-teacher-scaling
    paths:
      - "src/optdistil/teachers/meta_mlp.py"
      - "src/optdistil/distill/meta_train.py"
      - "scripts/probe_meta_teacher_scaling.py"
      - "tests/test_meta_teacher.py"
      - ".github/workflows/meta-teacher-scaling.yml"
  workflow_dispatch:

concurrency:
  group: meta-teacher-scaling-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scaling:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.10"
          python-version: "3.11"
          enable-cache: true
      - name: Sync CPU environment
        run: uv sync --locked --extra cpu
      - name: Meta-teacher tests
        run: uv run --locked --extra cpu pytest -q tests/test_meta_teacher.py
      - name: Meta-teacher capacity scaling quick probe
        run: >-
          uv run --locked --extra cpu python scripts/probe_meta_teacher_scaling.py
          --quick --output artifacts/meta-teacher-scaling.json
      - name: Upload scaling metrics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: meta-teacher-scaling
          path: artifacts/meta-teacher-scaling.json
          if-no-files-found: ignore
