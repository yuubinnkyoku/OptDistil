name: stochastic-nonlinear-controls

on:
  push:
    branches:
      - experiment/contextual-teacher
    paths:
      - "src/optdistil/tasks/frozen_readout_mlp.py"
      - "src/optdistil/distill/secant_features.py"
      - "scripts/probe_stochastic_nonlinear_controls.py"
      - "tests/test_frozen_readout_mlp.py"
      - ".github/workflows/stochastic-nonlinear-controls.yml"
  workflow_dispatch:

concurrency:
  group: stochastic-nonlinear-controls-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.10"
          python-version: "3.11"
          enable-cache: true
      - name: Sync CPU environment
        run: uv sync --locked --extra cpu
      - name: Ruff
        run: >-
          uv run --locked --extra cpu ruff check
          src/optdistil/tasks/frozen_readout_mlp.py
          scripts/probe_stochastic_nonlinear_controls.py
          tests/test_frozen_readout_mlp.py
      - name: Minibatch gradient tests
        run: uv run --locked --extra cpu pytest -q tests/test_frozen_readout_mlp.py
      - name: Stochastic nonlinear sweep
        run: >-
          uv run --locked --extra cpu python scripts/probe_stochastic_nonlinear_controls.py
          --output artifacts/stochastic-nonlinear-controls.json
      - name: Upload metrics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: stochastic-nonlinear-controls
          path: artifacts/stochastic-nonlinear-controls.json
          if-no-files-found: ignore
